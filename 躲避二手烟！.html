  {end:5400,name:'超市街区', sky:['#2b2340','#83505c','#dd9468'], bld:['#463b49','#4e4351'], road:'#4d4450', walk:'#77707a', wall:'#403842', signs:['超市','药房','早点','便利','水果'], col:'#ffd06a'}
];
function segmentAt(x){for(const s of SEGMENTS)if(x<s.end)return s;return SEGMENTS[SEGMENTS.length-1];}
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;

const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function rect(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function blockCircle(c,cx,cy,r,col){
  c.fillStyle=col;
  for(let y=Math.round(cy-r);y<=Math.round(cy+r);y+=2){
    const dy=y-cy,half=Math.sqrt(Math.max(0,r*r-dy*dy));
    c.fillRect(Math.round(cx-half),y,Math.round(half*2),2);
  }
}
function drawText(c,s,x,y,size,col,align='left',bold=true){
  c.font=(bold?'bold ':'')+size+'px "Microsoft YaHei","PingFang SC",sans-serif';
  c.textAlign=align;c.textBaseline='middle';c.fillStyle=col;c.fillText(s,x,y);
}
function txt(s,x,y,size,col,align='left',bold=true){drawText(ctx,s,x,y,size,col,align,bold);}

// 路口定义
const INTERSECTIONS=[
  {x:620, green:4.2, red:4.5, offset:0,   name:'南锣鼓巷口'},
  {x:1050,green:4.2, red:4.5, offset:.8,  name:'灯市口'},

  {x:4550,green:4.2, red:4.5, offset:6.38,name:'绿道口'},
  {x:5050,green:4.2, red:4.5, offset:6.46,name:'超市前路口'}
];
// 路上的汽车：既是背景也是实体障碍，必须绕行（不扣血）
const CARS=[
  {x:300,y:272,col:'#d8a72e'},{x:820,y:206,col:'#4b6b87'},
  {x:1250,y:272,col:'#d8a72e'},{x:1700,y:206,col:'#4b6b87'},
  {x:2200,y:272,col:'#d8a72e'},{x:2650,y:206,col:'#4b6b87'},
  {x:3150,y:272,col:'#d8a72e'},{x:3700,y:206,col:'#4b6b87'},
  {x:4250,y:272,col:'#d8a72e'},{x:4780,y:206,col:'#4b6b87'},
  {x:5200,y:272,col:'#d8a72e'}
];
// 红绿灯完全按全局时间独立循环，与玩家是否接近无关
function lightOf(ix){
  const c=ix.green+ix.red, t=(elapsed+ix.offset)%c;
  return t<ix.green?{green:true,remain:ix.green-t}:{green:false,remain:c-t};
}

// ---------- 背景 ----------
const far=document.createElement('canvas');far.width=WORLD_W;far.height=180;
const fc=far.getContext('2d');
const near=document.createElement('canvas');near.width=WORLD_W;near.height=H;
const nc=near.getContext('2d');
function drawTaxi(c,x,y,col){
  // 以车底为锚点放大，避免放大后车沉到路面以下
  c.save();c.translate(x,y+15);c.scale(CAR_SCALE,CAR_SCALE);c.translate(-x,-(y+15));
  rect(c,x,y,64,16,'#1c2026');rect(c,x+4,y-6,54,18,col);
  rect(c,x+12,y-12,34,8,col==='#d8a72e'?'#c79a28':'#3f5d74');
  rect(c,x+16,y-10,12,6,'#263746');rect(c,x+30,y-10,12,6,'#263746');
  rect(c,x+6,y+11,8,4,'#e8e3c8');rect(c,x+50,y+11,8,4,'#d35a3c');
  c.restore();
}
function drawShop(c,x,w,h,sign,col,i,wall){
  rect(c,x,120-h,w,h,wall);
  rect(c,x,120-h,w,3,i%2?'#4b5663':'#5a6572');
  for(let wy=120-h+12;wy<108;wy+=13)
    for(let wx=x+7;wx<x+w-8;wx+=11)
      rect(c,wx,wy,5,7,(wx+wy+i)%4===0?'#d6bd7c':'#222b36');
  rect(c,x+3,108,w-6,14,'#202a35');rect(c,x+8,107,w-16,10,'#111820');
  c.save();c.shadowColor=col;c.shadowBlur=6;drawText(c,sign,x+w/2,112,9,col,'center');c.restore();
}
// ---- 北京地标：按参考图改为紫粉蓝水彩线稿风格 ----
// 景墙：蜂窝六边形纹理（参考图最左）
function drawPatternWall(c,x,w,base){
  rect(c,x,base-32,w,32,'#d97bb5');
  rect(c,x,base-32,w,3,'#f0b8d8');
  c.strokeStyle='#a85494';c.lineWidth=1;
  for(let row=0;row<4;row++)for(let col=0;col<Math.floor(w/16);col++){
    const hx=x+8+col*16+(row%2)*8,hy=base-26+row*8;
    c.beginPath();
    for(let k=0;k<6;k++){
      const a=Math.PI/3*k,a2=Math.PI/3*(k+1);
      if(k===0)c.moveTo(hx+Math.cos(a)*5,hy+Math.sin(a)*5);
      c.lineTo(hx+Math.cos(a2)*5,hy+Math.sin(a2)*5);
    }
    c.stroke();
  }
}
// 中央电视塔：细长锥形塔身 + 球形观景台 + 天线
function drawCCTVTower(c,cx,base){
  const H=130,sy=base-H+34;
  rect(c,cx-9,base-4,18,5,'#a85494');
  rect(c,cx-6,base-9,12,6,'#c46aa8');
  for(let y=base-9;y>sy;y-=2){
    const t=(base-9-y)/(H-43),w=Math.max(3,9-t*5);
    rect(c,cx-w/2,y,w,2,t>.55?'#c46aa8':'#e090c0');
  }
  for(let i=0;i<8;i++){
    const yy=sy-14+i*4,w=14-Math.abs(i-3.5)*1.6;
    rect(c,cx-w/2,yy,w,3,i%2?'#f0b8d8':'#d97bb5');
    rect(c,cx-w/2,yy,w,1,'#f8d4e8');
  }
  rect(c,cx-2,sy-24,4,12,'#e090c0');
  rect(c,cx-1,sy-52,2,30,'#c46aa8');
  rect(c,cx,sy-62,1,12,'#f0b8d8');
  rect(c,cx-2,sy-64,5,3,'#f8d4e8');
}
// 天坛祈年殿：三层攒尖圆顶 + 柱子 + 台基
function drawTempleOfHeaven(c,cx,base){
  rect(c,cx-24,base-4,48,5,'#a85494');
  rect(c,cx-20,base-10,40,6,'#d97bb5');
  for(let x=cx-16;x<=cx+16;x+=8)rect(c,x,base-34,3,24,'#c46aa8');
  const tiers=[
    {y:base-34,bw:48,tw:28,h:12,col:'#d97bb5',dark:'#a85494'},
    {y:base-50,bw:38,tw:20,h:11,col:'#e090c0',dark:'#c46aa8'},
    {y:base-65,bw:28,tw:10,h:10,col:'#f0b8d8',dark:'#d97bb5'}
  ];
  for(const t of tiers){
    c.fillStyle=t.col;c.beginPath();
    c.moveTo(cx-t.tw/2,t.y);c.lineTo(cx+t.tw/2,t.y);
    c.lineTo(cx+t.bw/2,t.y-t.h);c.lineTo(cx-t.bw/2,t.y-t.h);
    c.closePath();c.fill();
    rect(c,cx-t.bw/2-3,t.y-t.h,t.bw+6,3,t.dark);
    rect(c,cx-t.bw/2-1,t.y-2,t.bw+2,2,t.dark);
  }
  rect(c,cx-2,base-80,4,6,'#f0b8d8');
  rect(c,cx-1,base-84,2,6,'#f8d4e8');
}
// 故宫门楼：蓝色两层庑殿顶 + 城台拱门
function drawPalaceGate(c,cx,base){
  rect(c,cx-32,base-30,64,30,'#4a5bb0');
  rect(c,cx-32,base-30,64,3,'#7a8fd8');
  for(let i=-1;i<=1;i++){
    const gx=cx+i*19;
    c.fillStyle='#262a5a';c.beginPath();
    c.arc(gx,base-11,7,Math.PI,0);c.lineTo(gx+7,base);c.lineTo(gx-7,base);c.closePath();c.fill();
    rect(c,gx-8,base-2,16,2,'#3d4a9e');
  }
  c.fillStyle='#5b6fc0';c.beginPath();
  c.moveTo(cx-22,base-32);c.lineTo(cx+22,base-32);
  c.lineTo(cx+34,base-42);c.lineTo(cx-34,base-42);c.closePath();c.fill();
  rect(c,cx-36,base-45,72,4,'#3d4a9e');
  rect(c,cx-20,base-58,40,14,'#5b6fc0');
  for(let i=0;i<3;i++)rect(c,cx-15+i*12,base-55,6,8,'#3d4a9e');
  c.fillStyle='#7a8fd8';c.beginPath();
  c.moveTo(cx-14,base-60);c.lineTo(cx+14,base-60);
  c.lineTo(cx+26,base-70);c.lineTo(cx-26,base-70);c.closePath();c.fill();
  rect(c,cx-28,base-73,56,4,'#3d4a9e');
  rect(c,cx-2,base-80,4,8,'#7a8fd8');
  rect(c,cx-4,base-82,8,3,'#9ab0f0');
}
// 鸟巢：紫粉网格编织碗状外壳
function drawNest(c,cx,base){
  const rx=48,ry=25,my=base-26;
  for(let y=my-ry;y<=my+ry;y+=2){
    const t=(y-my)/ry,hw=rx*Math.sqrt(Math.max(0,1-t*t));
    for(let x=cx-hw;x<cx+hw;x+=3){
      const nx=(x-cx)/rx,inner=nx*nx+t*t<.5;
      if(inner&&y<my+ry-5)continue;
      const weave=((Math.round((x-cx)/3)+Math.round((y-my)/2))%3===0);
      rect(c,x,y,3,2,weave?'#c98fd4':'#8e6fc0');
    }
  }
  for(let k=-2;k<=2;k++)for(let t=-.9;t<=.9;t+=.12){
    const x=cx+k*12+t*20,y=my+t*ry*.9;
    if(Math.abs((x-cx)/rx)<.95)rect(c,x,y,3,2,'#b995e0');
  }
  rect(c,cx-42,my-ry,84,2,'#d9a8e4');
  rect(c,cx-34,base-2,5,8,'#7d5cae');rect(c,cx+29,base-2,5,8,'#7d5cae');
}
function drawOfficeTower(c,x,h,w,col){
  rect(c,x,150-h,w,h,col);
  for(let y=150-h+6;y<148;y+=8)
    for(let xx=x+4;xx<x+w-3;xx+=6)rect(c,xx,y,3,4,'#9ab0f0');
  rect(c,x+w/2-1,150-h-8,2,8,'#7a8fd8');
}
// 央视大楼（大裤衩）：蓝色门形框 + 网格幕墙
function drawCCTV(c,x,base){
  const top=base-72;
  // 两条外撇斜腿，中间留大洞，整体向右上倾斜（参考图的大裤衩轮廓）
  c.fillStyle='#4a5bb0';c.beginPath();
  c.moveTo(x,base);c.lineTo(x+16,top+10);c.lineTo(x+26,top+10);c.lineTo(x+10,base);c.closePath();c.fill();
  c.beginPath();

function noteHz(n){return 440*Math.pow(2,(n-69)/12);}
function ensureAudio(){
  try{
    if(!audio){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return null;
      audio=new AC();
      musicGain=audio.createGain();
      musicGain.gain.value=muted?0:MUSIC_VOL;
      musicGain.connect(audio.destination);
    }
    if(audio.state==='suspended'){const p=audio.resume();if(p&&p.catch)p.catch(()=>{});}

  }catch(e){return null;}
}

function sfx(freq,dur,type='square',vol=.045){
  if(muted)return;
  try{
    const a=ensureAudio();if(!a)return;
    const o=a.createOscillator(),g=a.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,a.currentTime);
    g.gain.setValueAtTime(vol,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+dur);
    o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur);
  }catch(e){}
}
let musicName=null,musicTimer=null,musicStep=0,nextMusicTime=0,noiseBuffer=null;
function chipNote(hz,start,dur,type,vol){
  if(!audio||!musicGain)return;
  const o=audio.createOscillator(),g=audio.createGain();
  o.type=type;o.frequency.setValueAtTime(hz,start);
  g.gain.setValueAtTime(.0001,start);
  g.gain.linearRampToValueAtTime(vol,start+.006);
  g.gain.setValueAtTime(vol,start+Math.max(.02,dur*.55));
  g.gain.exponentialRampToValueAtTime(.0001,start+dur);
  o.connect(g);g.connect(musicGain);o.start(start);o.stop(start+dur+.02);
}
function noiseHit(start,vol=.04,dur=.03){
  if(!audio||!musicGain)return;
  try{
    if(!noiseBuffer){
      noiseBuffer=audio.createBuffer(1,Math.floor(audio.sampleRate*.5),audio.sampleRate);
      const d=noiseBuffer.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    }
    const src=audio.createBufferSource(),f=audio.createBiquadFilter(),g=audio.createGain();
    src.buffer=noiseBuffer;f.type='highpass';f.frequency.value=3200;
    g.gain.setValueAtTime(vol,start);g.gain.exponentialRampToValueAtTime(.0001,start+dur);
    src.connect(f);f.connect(g);g.connect(musicGain);src.start(start);src.stop(start+dur);
  }catch(e){}
}

  if(!audio||muted||!musicName)return;
  const t=CHIP_TRACKS[musicName];if(!t)return;
  const stepDur=60/t.bpm/4,until=audio.currentTime+.16;
  if(nextMusicTime<audio.currentTime-.2)nextMusicTime=audio.currentTime+.02;
  while(nextMusicTime<until){
    const ln=t.lead[musicStep%t.lead.length];
    if(ln>0)chipNote(noteHz(ln),nextMusicTime,stepDur*.9,'square',.16);
    const bn=t.bass[musicStep%t.bass.length];
    if(bn>0)chipNote(noteHz(bn),nextMusicTime,stepDur*1.7,'triangle',.24);
    if(t.hat&&musicStep%2===0)noiseHit(nextMusicTime,.035,.028);
    if(t.kick&&musicStep%8===0)chipNote(72,nextMusicTime,.09,'sine',.18);
    nextMusicTime+=stepDur;musicStep++;
  }

// ---------- 弹幕 ----------
function addBullet(x,y,vx,vy,maxR,life,grow,homing){
  // 烟雾必须持续向前：保证最低飞行速度，并记住初始水平方向，避免被风吹停/吹回头
  const sp0=Math.hypot(vx,vy)||1;
  if(sp0<SMOKE_MIN_SPEED){const k=SMOKE_MIN_SPEED/sp0;vx*=k;vy*=k;}
  bullets.push({x,y,vx,vy,dir0x:Math.sign(vx)||1,r:Math.min(maxR,maxR*.35),maxR,life,age:0,grow,
    variant:Math.floor(Math.random()*3),grazed:false,wf:rnd(.08,.3),
    homing:homing===undefined?rnd(.16,.38):homing});
}
// 所有烟雾都以玩家为目标：按玩家速度做提前量的瞄准角
function aimAngle(sx,sy,speed,offset){
  const dist=Math.hypot(sx-player.x,sy-player.y)||1;
  const flight=clamp(dist/speed,0,2.4);
  // 停止线回推会产生瞬时的负 vx，若不夹紧会让射手瞄到玩家身后，看起来像烟雾往回飞
  let tx=player.x+clamp(player.vx,-70,70)*flight*.6;
  // 提前量不得越过射手，否则近距离时会朝反方向开火
  const cap=player.x+(sx-player.x)*.55;
  tx=sx>player.x?Math.min(tx,cap):Math.max(tx,cap);
  // 目标点锁在玩家可走的路面内，避免上下人行道烟民朝屏幕外开火
  const ty=clamp(player.y+player.vy*flight*.4,150,320);
  return Math.atan2(ty-sy,tx-sx)+(offset||0);
}
function puff(x,y,n,col){
  for(let i=0;i<n;i++)particles.push({x,y,vx:rnd(-26,26),vy:rnd(-30,10),
    life:rnd(.3,.8),age:0,r:rnd(1,3),col:col||'#cbd1d2'});
}
function aimedAt(sx,sy,n,spread,speed,maxR,life,owner){
  const a=aimAngle(sx,sy,speed,0);
  for(let i=0;i<n;i++){
    const ang=a+(i-(n-1)/2)*spread+rnd(-.02,.02);
    addBullet(sx,sy,Math.cos(ang)*speed,Math.sin(ang)*speed,maxR,life,rnd(3,6));
  }
  if(owner)owner.puff=.35;
}
// 原本的环形烟改成「朝向玩家的宽扇形齐射」
function ringAt(sx,sy,n,speed,maxR,life,owner){
  const a=aimAngle(sx,sy,speed,0);
  for(let i=0;i<n;i++){
    const off=n>1?(i-(n-1)/2)/(n-1)*1.9:0;
    const ang=a+off+rnd(-.03,.03),sp=speed*rnd(.85,1.12);
    addBullet(sx,sy,Math.cos(ang)*sp,Math.sin(ang)*sp,maxR,life,rnd(2,5));
  }
  if(owner)owner.puff=.35;
}
// 螺旋烟改成「以玩家为中心的错速连射」
function spiralAt(sx,sy,phase,speed,maxR,life,owner){
  const a=aimAngle(sx,sy,speed,0);
  for(let i=0;i<4;i++){
    const ang=a+(i-1.5)*.2+Math.sin(phase+i)*.08,sp=speed*(1+i*.08);
    addBullet(sx,sy,Math.cos(ang)*sp,Math.sin(ang)*sp,maxR,life,4);
  }
  if(owner)owner.puff=.3;
}
// 滞留烟团同样直扑玩家，只是速度慢、体积大
function cloudAt(sx,sy,owner){
  const x=sx+rnd(-16,16),y=clamp(sy+rnd(-24,24),158,316);
  const a=aimAngle(x,y,34,0),sp=rnd(28,42);
  addBullet(x,y,Math.cos(a)*sp,Math.sin(a)*sp,rnd(20,26),rnd(6,9),rnd(2,3.2),.6);
  puff(x,y,5);if(owner)owner.puff=.4;
}

// 骑手和玩家看同一盏灯。等灯位置只在斑马线后方的停止线一侧，
// 已经驶过停止线、正在路口内的则原地等下一次绿灯，绝不会在路口另一侧排队。
function cyclistRedHold(c){
  for(const ix of INTERSECTIONS){
    const s=(c.x-ix.x)*c.dir; // 沿行进方向相对路口中心的位移，负数表示尚未到路口
    // 停止线在 s≈-46，斑马线在 s≈0~34；只在停止线后方排队，
    // 已进入路口的（s>0）原地等到绿灯，但不会有人停在路口另一侧（s>38）
    if(s>-112&&s<38&&!lightOf(ix).green)return ix;
  }
  return null;
}
// 路中央的行人也要在斑马线后等灯；人行道上平行于马路走的不用等
function pedRedHold(p){
  if(p.lane!=='road')return null;
  for(const ix of INTERSECTIONS){
    const s=(p.x-ix.x)*p.dir;
    if(s>=-112&&s<=8&&!lightOf(ix).green)return ix;
  }
  return null;
}

function useFan(){
  if(state!==S.PLAY||player.fanCd>0)return;
  player.fanCd=FAN_CD;fanFx=.36;player.inv=Math.max(player.inv,.28);
  let n=0;
  for(const b of bullets){
    const dx=b.x-player.x,dy=b.y-player.y,d=Math.hypot(dx,dy)||1;
    if(d<FAN_RANGE+b.r*.6){
      const power=150*(1-d/(FAN_RANGE+b.r*.6))+65;
      b.vx+=dx/d*power;b.vy+=dy/d*power;b.homing=0;
      b.r=Math.max(3,b.r*.72);b.maxR=Math.min(b.maxR,b.r+2);
      b.life=Math.min(b.life,b.age+2.6);n++;
    }
  }
  puff(player.x,player.y,10,'#e6f2f0');sfx(320,.16,'triangle',.055);
  if(n>0)sfx(180,.12,'sine',.03);
}
function hit(label,dmg){
  const hurt=Math.max(0,dmg||1); // 擦弹只扣 0.5 滴血
  player.lives=Math.max(0,player.lives-hurt);player.inv=hurt<1?1.0:2.0;shake=hurt<1?3:7;
  bumpFx=0;hurtFx=1.1;hurtLabel=label||'咳咳咳';
  if(hurt>=1)bullets=bullets.filter(b=>Math.hypot(b.x-player.x,b.y-player.y)>120);
  puff(player.x,player.y,hurt<1?10:20,'#e6a89a');sfx(90,hurt<1?.18:.4,'sawtooth',hurt<1?.04:.08);
  if(player.lives<=0){
    state=S.OVER;overShake=2.0;shake=2.2;settleRun();
    best=Math.max(best,Math.floor(score));sfx(65,.7,'sawtooth',.08);updateShopUI();
  }
}
function win(){
  state=S.WIN;settleRun();best=Math.max(best,Math.floor(score));updateShopUI();
  sfx(520,.5,'triangle',.07);setTimeout(()=>sfx(660,.5,'triangle',.06),160);
}
// 彩蛋：开局拐进家门，直接放弃步行改网购
function shopEnd(){
  state=S.SHOP;settleRun(true);
  best=Math.max(best,Math.floor(score));updateShopUI();
  puff(player.x,player.y,14,'#ffd07a');
  sfx(330,.18,'triangle',.05);setTimeout(()=>sfx(660,.35,'sine',.05),180);
}

// 路人/烟民/骑手是实体：不能穿过，撞到会扣血；汽车是纯障碍，只能绕行
function resolveBodies(verticalOnly){
  const bodies=[];
  // 路中央抽烟者：正面相遇必须上下绕开 38px；人行道上的是侧向火力，不套用绕行规则
  for(const e of enemies)if(Math.abs(e.x-player.x)<110)
    bodies.push({x:e.x,y:e.y-(e.lane==='road'?8:6),r:e.lane==='road'?16:13,clear:e.lane==='road'?38:0,block:true,hurt:true,kind:'smoker'});
  // 抽烟骑手会撞伤玩家；普通骑手只是挡路。骑手保持外卖车原尺寸判定
  for(const c of cyclists)if(Math.abs(c.x-player.x)<100)
    bodies.push({x:c.x,y:c.y-8,r:20,hurt:c.smoking!==false,kind:'cyclist'});
  // 普通人挡路但不喷烟、不扣血，只给出「让行」提示
  for(const p of passersby)if(Math.abs(p.x-player.x)<110&&p.lane==='road')
    bodies.push({x:p.x,y:p.y-6,r:13,hurt:false,kind:'passerby'});
  let bumped=false,touchedLabel=null;
  const minX=HOME_X-30,maxX=(verticalOnly&&blockedBy&&player.x<=blockedBy.ix.x-46+2)?blockedBy.ix.x-46:WORLD_W-12;
  for(let pass=0;pass<8;pass++){
    for(const b of bodies){
      const dx=player.x-b.x,dy=player.y-b.y;
      const dist=Math.hypot(dx,dy),min=BODY_PAD+b.r;
      if(dist>=min)continue;
      if(b.hurt&&player.inv<=0)touchedLabel=b.kind==='cyclist'?'危险！':'咳咳咳';
      // 受击无敌期间骑手不再阻挡：迎面快速骑手若持续物理推挤，会把玩家一路往左推甚至卡死
      if(b.kind==='cyclist'&&player.inv>0)continue;
      // 三种分离候选：径向、纯水平、纯垂直。取「能真正分开且移动最小」的一个，
      // 这样即使贴着屏幕边界或红灯停止线，也不会卡在实体里。
      const cand=(nx,ny)=>{
        nx=clamp(nx,minX,maxX);ny=clamp(ny,player.x>58&&player.x<100?118:150,320);
        return{x:nx,y:ny,d:Math.hypot(nx-b.x,ny-b.y),move:Math.hypot(nx-player.x,ny-player.y)};
      };
      const dd=dist||1;
      let list;
      if(b.kind==='cyclist'){
        // 骑手：只做垂直分离，把玩家推到车身上/下方绕行，绝不再水平推着玩家倒退
        const vn=Math.sqrt(Math.max(0,min*min-Math.min(min,Math.abs(dx))**2));
        const up=cand(player.x,b.y-vn),down=cand(player.x,b.y+vn);
        list=up.d>=min-.05?[up,down]:[down,up];
      }else{
        list=[cand(player.x+dx/dd*(min-dist),player.y+dy/dd*(min-dist))];
        const hn=Math.sqrt(Math.max(0,min*min-Math.min(min,Math.abs(dy))**2));
        list.push(cand(b.x+hn,player.y),cand(b.x-hn,player.y));
        const vn=Math.sqrt(Math.max(0,min*min-Math.min(min,Math.abs(dx))**2));
        list.push(cand(player.x,b.y+vn),cand(player.x,b.y-vn));
      }
      const need=b.clear||0,cannotPass=need&&player.x<b.x;
      if(need)list.push(cand(player.x,b.y+need+2),cand(player.x,b.y-need-2));
      // 正面没拉开垂直距离时，不接受「穿到抽烟者身后」的候选位置
      const rank=p=>{
        const sep=p.d>=min-.05;
        const legal=!(cannotPass&&p.x>=b.x-1&&Math.abs(p.y-b.y)<need);
        return (sep&&legal)?0:(sep||legal)?1:2;
      };
      let best=list[0],bestKey=Infinity;
      for(const p of list){
        const key=rank(p)*1e6+p.move*100+(min-p.d)*10;
        if(key<bestKey){bestKey=key;best=p;}
      }
      player.x=best.x;player.y=best.y;
      bumped=true;
    }
    // 汽车：矩形实体，判定框随车身一起放大，优先把玩家推到车身上下方绕行
    for(const car of CARS){
      if(Math.abs(car.x-player.x)>110)continue;
      const L=car.x+4*CAR_SCALE,R=car.x+60*CAR_SCALE,T=car.y+15-27*CAR_SCALE,B=car.y+15,PR=8;
      if(player.x+PR<=L||player.x-PR>=R||player.y+PR<=T||player.y-PR>=B)continue;
      const up=player.y-T,down=B-player.y;
      if(up<=down&&player.y-(up+PR)>=150)player.y-=(up+PR);
      else if(down<up&&player.y+(down+PR)<=320)player.y+=(down+PR);
      else{
        const pl=(player.x+PR)-L,pr=R-(player.x-PR);
        player.x+=pl<pr?-pl:pr;
      }
      player.y=clamp(player.y,150,320);
      player.x=clamp(player.x,HOME_X-30,WORLD_W-12);
      bumped=true;
    }
  }
  if(touchedLabel){
    hit(touchedLabel);
  }else if(bumped){
    bumpFx=.2;
    if(bumpSfx<=0){sfx(150,.06,'square',.018);bumpSfx=.4;}
  }
}
function applyRedLight(prevX,preserve){
  if(!preserve)blockedBy=null;
  for(const ix of INTERSECTIONS){
    const st=lightOf(ix),stopX=ix.x-46,farX=ix.x+48;
    if(st.green)continue;
    const wasLeft=prevX<=stopX+1;
    const atStop=blockedBy&&blockedBy.ix===ix&&player.x<=stopX+2;
    if((wasLeft||atStop)&&player.x>stopX-1&&player.x<farX){
      // 红灯亮起时尚未越过停止线：停在白线后
      player.x=stopX;
    }else if(player.x>stopX&&player.x<farX){
      // 绿灯中途转红：已进入路口也不能继续通过，原地等到下次绿灯
      player.x=clamp(Math.min(player.x,prevX),stopX,farX-1);
    }else continue;
    if(!blockedBy||blockedBy.ix!==ix)blockedBy={ix,st};
    else blockedBy.st=st;
  }
}

// ---------- 更新 ----------
function update(dt){
  // 结算画面只抖 2 秒后就完全静止，避免失败文字一直晃得看不清
  if(state===S.OVER&&overShake>0){
    overShake=Math.max(0,overShake-dt);
    shake=overShake>0?2.2:0;
  }else if(state!==S.PLAY){
    shake=Math.max(0,shake-dt*20);
  }
  if(state!==S.PLAY)return;
  elapsed+=dt;
  wind=Math.sin(elapsed*.31)*9+Math.sin(elapsed*.13+1)*5;
  windLabel=wind>4?'东风 →':wind<-4?'← 西风':'微风';
  player.fanCd=Math.max(0,player.fanCd-dt);
  player.inv=Math.max(0,player.inv-dt);fanFx=Math.max(0,fanFx-dt);
  protect=Math.max(0,protect-dt);shieldFx=Math.max(0,shieldFx-dt);
  bumpFx=Math.max(0,bumpFx-dt);bumpSfx=Math.max(0,bumpSfx-dt);hurtFx=Math.max(0,hurtFx-dt);

  let dx=0,dy=0;
  if(keys.left)dx--;if(keys.right)dx++;if(keys.up)dy--;if(keys.down)dy++;
  if(!joyActive&&touchDown&&touchTarget){
    const ddx=touchTarget.x-player.x,ddy=touchTarget.y-player.y,d=Math.hypot(ddx,ddy);
    if(d>3){dx=ddx/d;dy=ddy/d;}
  }
  if(joyActive){dx=joyDX/JOY_R;dy=joyDY/JOY_R;}
  const sp=player.speed;
  // 摇杆保留模拟量：轻推慢走，推到底全速；键盘与拖动仍按原样归一化
  const d=joyActive?Math.max(1,Math.hypot(dx,dy)):(Math.hypot(dx,dy)||1),prevX=player.x;
  player.x=clamp(player.x+dx/d*sp*dt,HOME_X-30,WORLD_W-12);
  // 家门口允许向上走进门里，触发网购彩蛋
  const atHomeDoor=player.x>58&&player.x<100;
  player.y=clamp(player.y+dy/d*sp*dt,atHomeDoor?118:150,320);
  player.vy=joyActive?dy/d*sp:(keys.up?-sp:keys.down?sp:0);

  // 实体碰撞：路人与骑手不可穿过；红灯：必须停在停止线后
  resolveBodies();
  applyRedLight(prevX);
  // 被停止线拦住时不产生“倒退速度”，否则烟民会朝玩家身后预判开火
  player.vx=blockedBy?0:(player.x-prevX)/dt;
  // 红灯等待区不再给保护或推开烟雾：烟必须继续追踪、继续有威胁
  camX=clamp(player.x-W*.38,0,WORLD_W-W);
  score+=Math.max(0,player.x-prevX)*1.5+dt*4;

  // 路边定点 / 走动烟民
  for(const e of enemies){
    e.puff=Math.max(0,e.puff-dt);
    if(e.walk){
      e.x+=e.dir*e.speed*dt;
      if(e.x>e.base+52){e.x=e.base+52;e.dir=-1;}
      if(e.x<e.base-52){e.x=e.base-52;e.dir=1;}
    }
    if(Math.abs(e.x-player.x)>320)continue;
    e.fire-=dt;
    if(e.fire<=0){e.fire=6.0*rnd(.85,1.15);routeFire(e);}
  }
  // 只给玩家前方最近的那个红灯路口补等灯骑手，避免所有路口一起补员造成暴涨
  const nextK=INTERSECTIONS.findIndex(ix=>ix.x>player.x-60);
  if(nextK>=0){
    const ix=INTERSECTIONS[nextK];
    if(!lightOf(ix).green&&ix.x<player.x+560){
      const holders=cyclists.filter(c=>c.assignIX===ix).length;
      const want=Math.min(2,WAITING_RIDERS[nextK].length);
      for(let n=holders;n<want&&cyclists.length<MAX_RIDERS;n++)spawnWaitingAt(ix,nextK);
    }
  }
  // 抽烟骑手：绿灯自由通过，中途转红立即停在路口继续等待
  cycleTimer-=dt;
  if(cycleTimer<=0){cycleTimer=rnd(7,10);if(cyclists.length<MAX_RIDERS)spawnCyclist();}
  for(let i=cyclists.length-1;i>=0;i--){
    const c=cyclists[i];
    const hold=cyclistRedHold(c);
    if(hold){
      // 玩家早已走远的路口，等待骑手直接回收，避免越积越多
      if(c.x<camX-140||c.x>camX+W+160){cyclists.splice(i,1);continue;}
      c.waitingFor=hold;
      c.phase+=dt*3;
      // 等红灯：不拖尾、不瞄准开火，只把烟向身后慢慢吐出
      if(c.smoking){c.fire-=dt;if(c.fire<=0){c.fire=rnd(2.4,3.4);cyclistIdleSmoke(c);}}
      continue;
    }
    c.waitingFor=null;
    c.x+=c.dir*c.speed*dt;c.phase+=dt*8;
    if(c.assignIX&&(c.x-c.assignIX.x)*c.dir>60)c.assignIX=null; // 已驶过该路口，不再算等灯骑手
    if(c.x<camX-80||c.x>camX+W+80){cyclists.splice(i,1);continue;}
    if(c.smoking){
      c.fire-=dt;if(c.fire<=0){c.fire=rnd(1.0,1.4);cyclistFire(c);}
      // 高速经过时身后拖出一串烟雾
      c.trail-=dt;if(c.trail<=0){c.trail=rnd(.12,.2);cyclistTrail(c);}
    }
  }
  // 不抽烟路人来回踱步，纯背景但仍是实体；走到路口红灯时停在斑马线后方
  for(const p of passersby){
    if(!p.walk||pedRedHold(p))continue;
    p.x+=p.dir*p.speed*dt;
    if(p.x>p.base+38){p.x=p.base+38;p.dir=-1;}
    if(p.x<p.base-38){p.x=p.base-38;p.dir=1;}
  }
  // 路人/骑手移动后再次消解重叠，避免穿模
  resolveBodies();
  applyRedLight(prevX,true);
  if(blockedBy){
    resolveBodies(true);
    // 最后一次分离可能把玩家挤到停止线左侧，立刻夹回来保持站位
    if(player.x<blockedBy.ix.x-46)player.x=blockedBy.ix.x-46;
  }
  player.vx=blockedBy?0:(player.x-prevX)/dt;

  // 弹幕
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];b.age+=dt;
    // 烟团在还没飞过玩家前缓慢修向；一旦越过就锁死方向继续飞，绝不调头或停下
    if(b.homing>0&&b.age<2.4){
      const bd=Math.hypot(player.x-b.x,player.y-b.y);
      const ahead=(player.x-b.x)*b.dir0x>0; // 玩家仍在烟雾的飞行方向前方
      if(bd>40&&ahead){
        const want=Math.atan2(player.y-b.y,player.x-b.x);
        const cur=Math.atan2(b.vy,b.vx);
        const diff=((want-cur+Math.PI*3)%(Math.PI*2))-Math.PI;
        const turn=clamp(diff,-b.homing*dt,b.homing*dt),sp=Math.max(SMOKE_MIN_SPEED,Math.hypot(b.vx,b.vy));
        b.vx=Math.cos(cur+turn)*sp;b.vy=Math.sin(cur+turn)*sp;
      }
    }
    // 风只做轻微扰动，不允许把烟雾的水平速度吹成反向或吹停
    const sp=Math.max(SMOKE_MIN_SPEED,Math.hypot(b.vx,b.vy));
    if(Math.hypot(b.vx,b.vy)<sp){const k=sp/(Math.hypot(b.vx,b.vy)||1);b.vx*=k;b.vy*=k;}
    let wx=b.vx+wind*b.wf;
    if(Math.sign(wx)!==b.dir0x&&Math.abs(wx)<Math.abs(b.vx))wx=b.vx;
    b.x+=wx*dt;b.y+=b.vy*dt;
    b.r=Math.min(b.maxR,b.r+b.grow*dt);
    if(b.age>b.life||b.x<camX-60||b.x>camX+W+60||b.y<120||b.y>350){bullets.splice(i,1);continue;}
    const dist=Math.hypot(b.x-player.x,b.y-player.y),hr=hitRadius(b);
    if(player.inv>0&&dist<62&&dist>.1){
      b.vx+=(b.x-player.x)/dist*150*dt;b.vy+=(b.y-player.y)/dist*150*dt;
    }
    // 擦弹不再加分，同样造成伤害：半滴血（0.5），并进入较短无敌
    if(!b.grazed&&dist<hr+15&&dist>player.r+hr){
      b.grazed=true;graze++;
      if(player.inv<=0&&!useSmokeProtection())hit('咳',.5);
    }
    if(player.inv<=0&&dist<hr+player.r){if(!useSmokeProtection())hit('咳',smokeDamage(b));break;}
  }
  for(let i=particles.length-1;i>=0;i--){
    const q=particles[i];q.age+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.97;q.vy*=.97;
    if(q.age>q.life)particles.splice(i,1);
  }
  shake=Math.max(0,shake-dt*20);
  if(player.x>58&&player.x<100&&player.y<136){shopEnd();return;}
  if(player.x>=MARKET_X)win();
}

// ---------- 绘制 ----------
function drawPerson(x,y,inv,side,smoking,col,variant){
  // 以脚底为锚点放大，身高约为骑手人物的 80%，站位不会下沉
  ctx.save();
  ctx.translate(x,y+11);ctx.scale(PERSON_SCALE,PERSON_SCALE);ctx.translate(-x,-(y+11));
  const blink=inv>0&&Math.floor(inv*12)%2===0;
  if(blink)ctx.globalAlpha=.45;
  if(side==='player'){
    ctx.globalAlpha*=.35;blockCircle(ctx,x,y+10,5,'#22272d');ctx.globalAlpha=blink?.45:1;
  }else{
    ctx.globalAlpha*=.6;blockCircle(ctx,x,y+10,7,'#22272d');ctx.globalAlpha=blink?.45:1;
  }
  if(side==='player'){
    // 参考侧身行走的裙装女孩：深色短发小辫、明亮裙装、暖色皮肤、深色平底鞋与身后小花束
    ctx.save();
    if(variant===-1){ctx.translate(x*2,0);ctx.scale(-1,1);}
    const skin='#f3c29c',hair='#2f2844',shoe='#262333';
    // 双腿与平底鞋
    rect(ctx,x-4,y-1,3,6,skin);rect(ctx,x-7,y+4,5,4,skin);rect(ctx,x-9,y+8,6,2,shoe);
    rect(ctx,x+1,y-1,3,5,skin);rect(ctx,x+3,y+3,3,5,skin);rect(ctx,x+4,y+8,6,2,shoe);
    rect(ctx,x-9,y+9,6,1,'#3a2f4d');rect(ctx,x+4,y+9,6,1,'#3a2f4d');
    // 伞状裙摆：亮奶油色 + 珊瑚红裙边与褶皱
    ctx.fillStyle='#fff5dc';ctx.beginPath();
    ctx.moveTo(x-5,y-7);ctx.lineTo(x+5,y-7);ctx.lineTo(x+10,y);ctx.lineTo(x-10,y);ctx.closePath();ctx.fill();
    rect(ctx,x-10,y-1,20,2,'#ff7896');rect(ctx,x-9,y+1,18,1,'#e9577c');
    rect(ctx,x-4,y-5,1,6,'#f0d6b4');rect(ctx,x+1,y-5,1,7,'#f0d6b4');rect(ctx,x+5,y-3,1,5,'#f0d6b4');
    // 上衣与腰带
    rect(ctx,x-5,y-14,10,7,'#fff9e8');rect(ctx,x-6,y-14,2,7,'#f0d6b4');
    rect(ctx,x-4,y-14,8,2,'#ff7896');rect(ctx,x-5,y-8,10,1,'#ffb45c');
    // 背后的手臂与小花束
    rect(ctx,x+3,y-13,3,6,skin);rect(ctx,x,y-9,4,2,skin);rect(ctx,x-2,y-10,2,2,skin);
    ctx.strokeStyle='#69b56f';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x-2,y-9);ctx.lineTo(x-8,y-12);ctx.moveTo(x-2,y-9);ctx.lineTo(x-9,y-9);ctx.stroke();
    blockCircle(ctx,x-9,y-13,2,'#ff8fb1');blockCircle(ctx,x-7,y-15,2,'#ffd166');
    blockCircle(ctx,x-11,y-10,2,'#8fd3c9');blockCircle(ctx,x-6,y-11,2,'#f78fb3');
    // 侧脸、短发与小辫
    blockCircle(ctx,x,y-18,5.5,hair);
    rect(ctx,x+1,y-20,5,6,skin);rect(ctx,x+5,y-19,2,2,skin);
    rect(ctx,x-1,y-20,6,2,hair);rect(ctx,x-4,y-19,3,7,hair);
    rect(ctx,x-7,y-17,4,2,hair);rect(ctx,x-9,y-16,3,3,hair);
    rect(ctx,x-8,y-16,2,1,'#ff7896');rect(ctx,x+4,y-19,1,1,'#4b3547');
    ctx.restore();
  }else{
    // 路人参考扁平插画造型：男款短发+长袖+短裤+看手机，女款短发+上衣+阔腿裤+斜挎包
    const dir=side==='left'?1:-1,smk=smoking!==false;
    const pal=smk?['#6b6a63','#4c4b46','#33302d','#5a4636','#2c2f34']:PASSER_COLORS[(col||0)%PASSER_COLORS.length];
    const male=(variant===undefined?(col||0):variant)%2===0,skin='#d9a37c';
    if(male){
      rect(ctx,x-5,y+4,3,5,skin);rect(ctx,x+2,y+4,3,5,skin);
      rect(ctx,x-6,y+8,5,3,'#553f33');rect(ctx,x+1,y+8,5,3,'#553f33');
      rect(ctx,x-6,y+9,6,2,pal[4]);rect(ctx,x+1,y+9,6,2,pal[4]);
      rect(ctx,x-5,y-1,10,6,pal[3]);
      rect(ctx,x-6,y-9,12,9,pal[0]);rect(ctx,x-7*dir,y-8,3,8,pal[1]);
      rect(ctx,x+(dir>0?5:-8),y-5,3,5,'#27333b');
      rect(ctx,x+(dir>0?5:-8),y-4,2,3,'#8fd6dc');
      rect(ctx,x+(dir>0?3:-7),y-3,3,2,skin);
      blockCircle(ctx,x,y-14,5,skin);
      rect(ctx,x-5,y-18,10,4,pal[2]);rect(ctx,x-5*dir,y-16,3,5,pal[2]);
    }else{
      rect(ctx,x-6,y-1,5,10,pal[3]);rect(ctx,x+1,y-1,5,10,pal[3]);
      rect(ctx,x-6,y+9,6,2,pal[4]);rect(ctx,x+1,y+9,6,2,pal[4]);
      rect(ctx,x-5,y-9,11,9,pal[0]);rect(ctx,x-7*dir,y-8,3,8,pal[1]);
      rect(ctx,x+(dir>0?5:-8),y-6,3,5,skin);
      rect(ctx,x-3*dir,y-9,2,9,'#c94335');
      rect(ctx,x+(dir>0?3:-9),y-2,6,4,'#d94a3a');
      blockCircle(ctx,x,y-15,5.5,pal[2]);rect(ctx,x-5,y-15,10,7,pal[2]);
      rect(ctx,x-3,y-14,7,6,skin);rect(ctx,x+dir*3,y-12,1,1,'#5a3a30');
    }
    if(smk){
      rect(ctx,dir>0?x+6:x-12,y-11,6,2,'#d8d3c6');
      rect(ctx,dir>0?x+12:x-13,y-12,2,3,Math.random()<.6?'#ff8a3d':'#f2c05a');
      ctx.globalAlpha=.55;blockCircle(ctx,dir>0?x+15:x-16,y-14,3,'#d5d9d8');ctx.globalAlpha=blink?.45:1;
    }
  }
  ctx.restore();
}
function drawCyclist(c){
  // 外卖骑手：多数黄车黄衣，穿插少量绿色/红色；深蓝裤子，按行进方向镜像
  const x=c.x-camX,y=c.y+Math.sin(c.phase)*1.5,smk=c.smoking!==false,gr=!!c.green,rd=!!c.red;
  const P=gr
    ? {hub:'#7fe09a',box:'#2f9b52',boxTop:'#4fd07a',boxHi:'#9df0b5',boxLo:'#27834a',
       body:'#3fbf6a',deck:'#74e096',bodyLo:'#2a9b56',bodyLo2:'#35a85c',
       front:'#4fc97a',frontHi:'#8ce8a6',lamp:'#eaffe8',
       coat:'#3fbf6a',coatHi:'#74e096',coatLo:'#2a9b56',
       helm:'#4fc97a',helmHi:'#8ce8a6',helmLo:'#2a9b56'}
    : rd
    ? {hub:'#ff8a7a',box:'#b52b2b',boxTop:'#e04a42',boxHi:'#ff8d82',boxLo:'#992020',
       body:'#e04a42',deck:'#ff7768',bodyLo:'#b8302c',bodyLo2:'#c93c34',
       front:'#ef5348',frontHi:'#ff9184',lamp:'#ffead0',
       coat:'#e04a42',coatHi:'#ff7d70',coatLo:'#b8302c',
       helm:'#ef5348',helmHi:'#ff9184',helmLo:'#b8302c'}
    : {hub:'#f2bb31',box:'#c77d16',boxTop:'#ffb627',boxHi:'#ffda5c',boxLo:'#d88a18',
       body:'#ffb627',deck:'#ffd23f',bodyLo:'#d98d16',bodyLo2:'#e09b1e',
       front:'#ffc831',frontHi:'#ffda55',lamp:'#fff0a8',
       coat:'#ffc22c',coatHi:'#ffd94a',coatLo:'#f5a623',
       helm:'#ffca2e',helmHi:'#ffd94a',helmLo:'#ffb627'};
  ctx.save();
  ctx.translate(Math.round(x),Math.round(y));
  if(c.dir<0)ctx.scale(-1,1);
  ctx.globalAlpha=.5;blockCircle(ctx,0,12,17,'#1d2028');ctx.globalAlpha=1;

  // 车轮
  blockCircle(ctx,-14,8,7,'#1b2540');blockCircle(ctx,-14,8,3,P.hub);
  blockCircle(ctx,14,8,7,'#1b2540');blockCircle(ctx,14,8,3,P.hub);
  // 后座外卖箱
  rect(ctx,-24,-9,15,14,P.box);rect(ctx,-23,-10,13,13,P.boxTop);
  rect(ctx,-22,-7,11,3,P.boxHi);rect(ctx,-22,-2,11,2,P.boxLo);
  // 车身与踏板
  rect(ctx,-16,0,22,7,P.body);rect(ctx,-13,6,26,4,P.deck);
  rect(ctx,-9,9,16,2,P.bodyLo);rect(ctx,-20,-1,8,4,P.bodyLo2);
  // 前护板、车把和车灯
  rect(ctx,8,-10,9,17,P.front);rect(ctx,10,-7,5,12,P.frontHi);
  rect(ctx,7,-12,10,3,'#333b4a');rect(ctx,15,-14,7,3,'#1c2534');
  rect(ctx,17,-10,4,3,P.lamp);
  // 座垫
  rect(ctx,-11,-3,12,3,'#252b3a');

  // 骑手：深蓝裤子与鞋
  rect(ctx,-7,-5,11,5,'#1f2b4d');rect(ctx,-1,0,10,5,'#26345c');
  rect(ctx,-2,4,10,3,'#121a2e');rect(ctx,4,6,7,3,'#121a2e');
  rect(ctx,-8,-7,8,4,'#26345c');
  // 上衣和手臂
  rect(ctx,-11,-20,17,14,P.coat);rect(ctx,-10,-19,11,11,P.coatHi);
  rect(ctx,-10,-19,3,11,P.coatLo);
  rect(ctx,0,-18,12,4,P.coat);rect(ctx,8,-15,7,4,'#f28c6a');
  rect(ctx,13,-13,5,3,'#f0a07f');
  // 头部、头盔
  rect(ctx,-5,-31,11,10,'#f0a07f');
  rect(ctx,-7,-33,15,6,P.helm);rect(ctx,-6,-35,12,3,P.helmHi);
  rect(ctx,5,-31,5,2,P.helmLo);rect(ctx,-5,-26,11,3,'#2a3447');
  if(smk){
    // 抽烟骑手：嘴边烟头和烟火，保留外卖骑手造型但一眼能分辨
    rect(ctx,7,-25,7,2,'#e8e4d8');

}
function render(){
  ctx.save();
  if(shake>0)ctx.translate(rnd(-shake,shake)|0,rnd(-shake,shake)|0);
  ctx.drawImage(far,-Math.round(camX*.35),0);
  ctx.drawImage(near,-Math.round(camX),0);
  ctx.globalAlpha=.10;rect(ctx,0,0,W,H,'#ff9a5c');ctx.globalAlpha=1;

  ctx.globalAlpha=.085;
  for(let i=0;i<7;i++){
    const x=((elapsed*5+i*83)%(W+150))-90,y=30+i*24;
    blockCircle(ctx,x,y,32,'#ffd2a0');blockCircle(ctx,x+40,y+6,22,'#ffd2a0');
  }
  ctx.globalAlpha=1;

  // 红绿灯灯色
  for(const ix of INTERSECTIONS){
    const st=lightOf(ix),sx=ix.x-48-camX;
    if(sx<-30||sx>W+30)continue;
    const col=st.green?'#63e39a':'#ff5b4c';
    ctx.globalAlpha=.9;
    blockCircle(ctx,sx-4,64,5,col);blockCircle(ctx,sx-4,220,5,col);
    ctx.globalAlpha=.16+.1*Math.sin(elapsed*5);
    blockCircle(ctx,sx-4,64,13,col);blockCircle(ctx,sx-4,220,13,col);
    ctx.globalAlpha=1;
    if(Math.abs(player.x-ix.x)<300){
      const label=(st.green?'绿灯 ':'红灯 ')+st.remain.toFixed(1)+'s';
      rect(ctx,sx-34,36,70,14,'rgba(12,17,24,.72)');
      txt(label,sx+1,43,10,col,'center');
    }
  }

  // 路边烟民
  for(const e of enemies){
    const ex=e.x-camX;if(ex<-30||ex>W+30)continue;
    drawPerson(ex,e.y,0,e.dir>0?'left':'right',true,0,e.i);
    if(e.walk){ctx.globalAlpha=.7;rect(ctx,ex-13,e.y+13,26,3,'#20262c');ctx.globalAlpha=1;}
    if(e.puff>0){ctx.globalAlpha=e.puff;blockCircle(ctx,ex+13*e.dir,e.y-20,3+e.puff*7,'#d5d9d8');ctx.globalAlpha=1;}
  }
  // 不抽烟的普通人：蓝外套、无烟头，和烟民混在一起当背景板
  for(const p of passersby){
    const ex=p.x-camX;if(ex<-30||ex>W+30)continue;
    drawPerson(ex,p.y,0,p.dir>0?'left':'right',false,p.col,p.i);
    if(p.walk){ctx.globalAlpha=.6;rect(ctx,ex-13,p.y+13,26,3,'#20262c');ctx.globalAlpha=1;}
  }

  // 骑手
  for(const c of cyclists){
    if(c.x-camX<-40||c.x-camX>W+40)continue;
    drawCyclist(c);
  }
  // 烟雾弹幕
  for(const b of bullets){
    const a=clamp(Math.min(b.age/.35,(b.life-b.age)/1.2),0,1);
    const sz=Math.round(b.r*SMOKE_SCALE/2)*2,sx=Math.round(b.x-camX),sy=Math.round(b.y);
    // 淡淡的外圈就是实际判定边界：比烟团可见边缘再大一圈，避免“看不见的判定”
    if(Math.abs(sx-W/2)<190){
      ctx.globalAlpha=a*.16;ctx.strokeStyle='#eef2f0';ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(sx,sy,hitRadius(b),0,7);ctx.stroke();
    }
    ctx.globalAlpha=a*.92;
    ctx.drawImage(smokes[b.variant],sx-Math.round(sz/2),sy-Math.round(sz/2),sz,sz);
  }
  ctx.globalAlpha=1;
  for(const q of particles){
    ctx.globalAlpha=1-q.age/q.life;rect(ctx,q.x-camX,q.y,q.r,q.r,q.col);
  }
  ctx.globalAlpha=1;

  if(fanFx>0){
    const t=1-fanFx/.36,px=player.x-camX,py=player.y;
    ctx.globalAlpha=(1-t)*.85;ctx.strokeStyle='#dff5f2';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(px,py,10+t*FAN_RANGE,-1.1,1.1);ctx.stroke();
    for(let i=-1;i<=1;i++)rect(ctx,px+6+t*22,py+i*12,18-t*8,2,'#e8f7f4');
    ctx.globalAlpha=1;
  }
  const px=player.x-camX;
  if(protect>0){
    const col=shieldLabel==='防毒面具'?'#8be9ff':'#dff5f2';
    ctx.globalAlpha=.55+.2*Math.sin(elapsed*12);ctx.strokeStyle=col;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(px,player.y,17,0,7);ctx.stroke();
    txt(protect.toFixed(1)+'s',px,player.y-46,9,col,'center');ctx.globalAlpha=1;
  }
  drawPerson(px,player.y,player.inv,'player',false,0,player.vx<-1?-1:1);
  if(shieldFx>0){
    ctx.globalAlpha=clamp(shieldFx/.9,0,1);
    txt(shieldLabel+'挡住了',px,player.y-34,10,'#9fe3db','center');ctx.globalAlpha=1;
  }
  if(hurtFx>0){
    // 受击反馈：烟/烟民让人咳嗽，骑手冲撞是危险，绝不再显示“让行”
    ctx.globalAlpha=clamp(hurtFx/1.1,0,1);
    txt(hurtLabel,px,player.y-34,12,'#ff6b5b','center');
    ctx.globalAlpha=1;
  }else if(bumpFx>0){
    ctx.globalAlpha=clamp(bumpFx/.2,0,1);
    txt('让行',px,player.y-34,10,'#ffd76a','center');
    ctx.globalAlpha=1;
  }

  // HUD
  rect(ctx,0,0,W,22,'rgba(12,17,24,.72)');
  txt('生命',6,11,10,'#cbd2d7');
  for(let i=0;i<MAX_LIVES;i++){
    const left=player.lives-i, x=30+i*6.4;
    if(left>=1)blockCircle(ctx,x,11,3.1,'#e35b4c');
    else if(left>0){blockCircle(ctx,x,11,3.1,'#5d3b39');blockCircle(ctx,x,11,1.8,'#e35b4c');}
    else blockCircle(ctx,x,11,3.1,'#3c454e');
  }
  txt('扇风',96,11,10,'#cbd2d7');
  rect(ctx,120,7,34,8,'#3b444c');
  const ready=player.fanCd<=0;
  rect(ctx,120,7,34*(ready?1:1-player.fanCd/FAN_CD),8,ready?'#7fd3c9':'#5d8c92');
  txt(ready?'就绪':player.fanCd.toFixed(1),158,11,9,ready?'#9fe3db':'#cbd2d7');
  txt('擦 '+graze,190,11,10,'#cbd2d7');
  txt('分 '+String(Math.floor(score)).padStart(5,'0'),234,11,10,'#e6ebee');
  txt(money+'G',294,11,10,'#ffd76a');
  txt('口'+masks+'/'+(MAX_MASKS+maskActive),328,11,9,'#dff5f2');
  txt('面'+gasMasks+(gasMasks?'/'+gasUses+'次':''),372,11,9,protect>0?'#8be9ff':'#aeb8be');
  txt(windLabel,W-8,11,10,'#aeb8be','right');

  if(blockedBy){
    rect(ctx,W/2-86,26,172,20,'rgba(160,40,32,.85)');
    txt('红灯！等待 '+blockedBy.st.remain.toFixed(1)+'s',W/2,36,11,'#ffe6d8','center');
  }
  rect(ctx,0,H-7,W,7,'rgba(12,17,24,.7)');
  rect(ctx,0,H-7,W*clamp((player.x-HOME_X)/(MARKET_X-HOME_X),0,1),7,'#d8a74a');
  txt('家',8,H-17,10,'#eceff0','left');
  txt(areaName()+' · 距超市 '+Math.max(0,Math.round(MARKET_X-player.x))+'m',W/2,H-17,10,'#eceff0','center');
  txt('超市',W-8,H-17,10,'#9fe3b8','right');

  if(state===S.TITLE)drawTitle();
  if(state===S.PAUSE)drawOverlay('暂停','按 P 继续');
  if(state===S.OVER)drawOverlay('被烟呛倒','走到 '+areaName()+' · 距超市 '+Math.max(0,Math.round(MARKET_X-player.x))+'m\n擦弹 '+graze+' · 分数 '+Math.floor(score)+'\n按 Enter / 点击画面 重来'+bonusLine());
  if(state===S.WIN)drawOverlay('到达超市！','用时 '+elapsed.toFixed(1)+' 秒 · 擦弹 '+graze+' · 分数 '+Math.floor(score)+'\n按 Enter / 点击画面 再走一趟'+bonusLine());
  if(state===S.SHOP)drawOverlay('放弃出门，还是回家网购算了','用时 '+elapsed.toFixed(1)+' 秒 · 按 Enter / 点击画面 再走一趟'+bonusLine());
  drawJoystick();
  drawFanButton();
  drawPlayBuy();
  ctx.restore();
}
function bonusLine(){if(homeExit)return '\n回家网购 · 下局余额照常保留';return runBonus?'\n超过 '+BONUS_SCORE+' 分 · 下局继承余额、口罩多买 1 个':'\n未达 '+BONUS_SCORE+' 分 · 下局余额重置为 64G';}
function drawJoystick(){
  if(!IS_TOUCH||state!==S.PLAY)return;
  const mag=Math.hypot(joyDX,joyDY),k=Math.min(1,mag/JOY_R);
  const hx=JOY_X+(mag?joyDX/mag*JOY_R*.55*k:0),hy=JOY_Y+(mag?joyDY/mag*JOY_R*.55*k:0);
  ctx.save();ctx.globalAlpha=joyActive?.5:.32;
  blockCircle(ctx,JOY_X,JOY_Y,JOY_R,'#0d171b');
  ctx.strokeStyle='#c8e8e2';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(JOY_X,JOY_Y,JOY_R,0,Math.PI*2);ctx.stroke();
  blockCircle(ctx,hx,hy,10,joyActive?'#dff7f1':'#9dbdb8');
  ctx.restore();
}

let last=performance.now();
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);render();syncMusic();requestAnimationFrame(loop);}
requestAnimationFrame(loop);

function startGame(){
  // 标题页买的装备带进本局；失败/通关/彩蛋后重开才重置余额和装备
  if(state!==S.TITLE)reset();
  maskActive=maskBank;runBonus=false;settled=false;
  state=S.PLAY;canvas.focus();sfx(440,.12,'triangle',.05);updateShopUI();
}
window.addEventListener('keydown',e=>{
  unlockAudio();
  const k=e.key.toLowerCase();
  if(['arrowleft','arrowright','arrowup','arrowdown',' '].includes(k))e.preventDefault();
  if(k==='arrowleft'||k==='a')keys.left=true;
  if(k==='arrowright'||k==='d')keys.right=true;
  if(k==='arrowup'||k==='w')keys.up=true;
  if(k==='arrowdown'||k==='s')keys.down=true;
  if(k===' '||k==='x')useFan();
  if(k==='enter'){if(state===S.TITLE||state===S.OVER||state===S.WIN||state===S.SHOP)startGame();}
  if(k==='p'||k==='escape'){if(state===S.PLAY)state=S.PAUSE;else if(state===S.PAUSE)state=S.PLAY;}
  if(k==='m')toggleSound();
  if(k==='1')buyMask();
  if(k==='2')buyGasMask();
});
window.addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a')keys.left=false;
  if(k==='arrowright'||k==='d')keys.right=false;
  if(k==='arrowup'||k==='w')keys.up=false;
  if(k==='arrowdown'||k==='s')keys.down=false;
});
function pointerPos(e){
  const r=canvas.getBoundingClientRect();
  return{x:(e.clientX-r.left)/r.width*W+camX,y:(e.clientY-r.top)/r.height*H};
}
function titleShopHit(e){
  const r=canvas.getBoundingClientRect();
  const lx=(e.clientX-r.left)/r.width*W,ly=(e.clientY-r.top)/r.height*H;
  for(const b of shopButtons()){
    if(lx>=b.x&&lx<=b.x+b.w&&ly>=b.y&&ly<=b.y+b.h){
      if(b.can){if(b.id==='mask')buyMask();else buyGasMask();}
      else sfx(120,.08,'square',.02);
      return true;
    }
  }
  return false;
}
canvas.addEventListener('pointerdown',e=>{
  unlockAudio();
  if(state===S.TITLE){if(titleShopHit(e))return;startGame();return;}
  if(state!==S.PLAY){startGame();return;}
  if(playBuyHit(e))return;
  const fp=localPos(e);
  if(Math.hypot(fp.x-FAN_BTN_X,fp.y-FAN_BTN_Y)<=FAN_BTN_R+8){useFan();return;}
  if(IS_TOUCH){
    const p=localPos(e);
    if(Math.hypot(p.x-JOY_X,p.y-JOY_Y)<=JOY_R+18){
      joyId=e.pointerId;joyActive=true;setJoy(e);
      try{canvas.setPointerCapture(e.pointerId);}catch(err){}
      return;
    }
  }
  touchDown=true;touchTarget=pointerPos(e);
  try{canvas.setPointerCapture(e.pointerId);}catch(err){}
});
canvas.addEventListener('pointermove',e=>{if(joyActive&&e.pointerId===joyId)setJoy(e);else if(touchDown)touchTarget=pointerPos(e);});
canvas.addEventListener('pointerup',e=>{if(e.pointerId===joyId)resetJoy();touchDown=false;touchTarget=null;});
canvas.addEventListener('pointercancel',e=>{if(e.pointerId===joyId)resetJoy();touchDown=false;touchTarget=null;});
document.getElementById('fanBtn').addEventListener('pointerdown',e=>{e.preventDefault();useFan();});
function toggleSound(){
  muted=!muted;unlockAudio();
  document.getElementById('soundBtn').textContent='声音：'+(muted?'关':'开');
  if(audio&&musicGain){
    const p=audio.resume?audio.resume():null;if(p&&p.catch)p.catch(()=>{});
    musicGain.gain.setTargetAtTime(muted?0:MUSIC_VOL,audio.currentTime,.02);
  }
  if(!muted&&audio){nextMusicTime=audio.currentTime+.05;}
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){setMusic(null);if(audio&&audio.suspend)audio.suspend();}
  else if(audioUnlocked){ensureAudio();musicName=null;syncMusic();}
});
document.getElementById('soundBtn').addEventListener('click',toggleSound);
})();
</script>
</body>
